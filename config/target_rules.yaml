# Target rules (v0.2). Every number has a source key into literature/SOURCES.md and a decision id (REVIEW.md §10).
# Edit here, not in code. A nutrition scientist can review this file on its own.

energy:
  ree_equations:
    ten_haaf_weight:  # athletes 18–35 y; best-validated without body composition (tenhaaf2014)
      formula: "11.936*W + 587.728*H_m - 8.129*age + 191.027*male + 29.279"
      source: tenhaaf2014
    ten_haaf_ffm:     # when fat-free mass is known
      formula: "22.771*FFM + 484.264"
      source: tenhaaf2014
    mifflin:          # general population
      formula: "10*W + 6.25*H_cm - 5*age + 5 (men) / -161 (women)"
      source: mifflin1990
  non_exercise_pal: 1.5   # PAL without planned exercise ('sedentary/light', fao2004 band 1.40–1.69); ASSUMPTION [U]
  exercise_met:           # average MET of a training hour by modality; ASSUMPTION [U] (Compendium of Physical Activities ranges)
    none: 0
    strength: 5.0
    endurance: 8.0
    hybrid: 7.0
  pal_max_sustainable: 2.4  # fao2004: PAL > 2.40 hard to maintain → warn
  kcal_per_kg_tissue_loss: 7700  # classic approximation for weight-loss energy deficit; ASSUMPTION (hall2011 shows it is crude)

carbohydrate_bands:   # g/kg/day by average training hours per day (thomas2016 Table 2); mapping hours→band is D7 [U]
  - {name: light,      max_h_per_day: 0.5, g_per_kg: [3, 5],  source: thomas2016}
  - {name: moderate,   max_h_per_day: 1.5, g_per_kg: [5, 7],  source: thomas2016}
  - {name: high,       max_h_per_day: 3.0, g_per_kg: [6, 10], source: thomas2016}
  - {name: very_high,  max_h_per_day: 24,  g_per_kg: [8, 12], source: thomas2016}

safeguards:           # PROJECT.md §9.1
  fat_pct_energy: [20, 35]        # efsa2010f, thomas2016 (D8)
  fat_pct_energy_fat_loss: [15, 35]  # helms2014 (D8)
  fat_pct_energy_race_week: [10, 25] # JUDGMENT CALL [U]: carbohydrate loading displaces fat for 1–2 days
  free_sugars_max_pct_energy: 10  # who2015 (D8)
  energy_availability_warn_kcal_per_kg_ffm: 30   # thomas2016: chronic EA < 30 impairs health/performance
  energy_availability_optimal_kcal_per_kg_ffm: 45  # thomas2016

presets:
  # ranking_preset: the default food-ranking weighting for this goal (src/metrics.py PRESETS)
  general_adult:
    label: "General adult (normal life)"
    ranking_preset: "Everyday budget"
    energy: {mode: maintain}
    protein_g_per_kg: {min: 0.83, default: 1.0, max: null, source: efsa2012, decision: D4}
    carbohydrate: {mode: pct_energy, pct: [45, 60], source: efsa2010c, decision: D7}
  muscle_gain:
    label: "Muscle gain / bodybuilding off-season"
    ranking_preset: "Bulking: balanced"
    energy: {mode: surplus, pct_of_tdee: 10, pct_of_tdee_advanced: 5, rate_pct_bm_week: [0.25, 0.5], source: iraki2019, decision: D6}
    protein_g_per_kg: {min: 1.6, default: 1.8, max: 2.2, source: morton2018, decision: D1}
    carbohydrate: {mode: band, min_g_per_kg: 3, source: iraki2019, decision: D7}
  fat_loss:
    label: "Fat loss (cut)"
    ranking_preset: "Cutting: filling protein on a budget"
    energy: {mode: deficit, rate_pct_bm_week: 0.7, rate_range: [0.5, 1.0], source: garthe2011, decision: D6}
    protein_g_per_kg: {min: 2.2, default: 2.4, max: 2.6, lbm_range: [2.3, 3.1], source: helms2014, decision: D3}
    carbohydrate: {mode: band, source: thomas2016, decision: D7}
    fat_pct_key: fat_pct_energy_fat_loss
  endurance:
    label: "Endurance base / build phase (triathlon, Ironman)"
    ranking_preset: "Endurance carbs on a budget"
    energy: {mode: maintain}
    protein_g_per_kg: {min: 1.4, default: 1.6, max: 2.0, source: thomas2016, decision: D2}
    carbohydrate: {mode: band, source: thomas2016, decision: D7}
  hybrid_gain:
    label: "Hybrid: muscle gain + endurance"
    ranking_preset: "Hybrid: bulk + endurance fuel"
    energy: {mode: surplus, pct_of_tdee: 10, pct_of_tdee_advanced: 5, rate_pct_bm_week: [0.25, 0.5], source: iraki2019, decision: D6}
    protein_g_per_kg: {min: 1.6, default: 1.8, max: 2.2, source: morton2018, decision: D1}
    carbohydrate: {mode: band, source: thomas2016, decision: D7}
  race_week:
    label: "Race week: carbohydrate loading (36–48 h before a race > 90 min)"
    ranking_preset: "Endurance carbs on a budget"
    energy: {mode: fit_macros, source: thomas2016, decision: D6}   # ≥ maintenance; raised if 10–12 g/kg carbs need it
    protein_g_per_kg: {min: 1.2, default: 1.4, max: 2.0, source: thomas2016, decision: D2}
    carbohydrate: {mode: g_per_kg, g_per_kg: [10, 12], source: thomas2016, decision: D7}   # Table 2: carbohydrate loading
    fat_pct_key: fat_pct_energy_race_week
    free_sugars_max_pct_energy: 25    # JUDGMENT CALL [U]: sugary low-residue carbohydrate is normal when loading
    micro_overrides: {fibre_g: {min: null, max: 25}}   # JUDGMENT CALL [U]: low fibre/residue to limit gut discomfort (burke2011)
    micro_minimums: report   # EFSA minimums are long-term averages; over 1–2 days they are reported, not enforced
    note: "For the last 1–2 days only. Vitamin/mineral minimums still apply but matter little over 2 days."
  professional:
    label: "Professional athlete (prescribed targets)"
    ranking_preset: "Price doesn't matter"
    energy: {mode: maintain}
    protein_g_per_kg: {min: 1.6, default: 1.8, max: 2.2, source: morton2018, decision: D1}
    carbohydrate: {mode: band, source: thomas2016, decision: D7}
    note: "Enter the prescribed numbers as overrides; cost weight 0 in priorities."
