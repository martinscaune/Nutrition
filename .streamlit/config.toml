# Shared by local runs and Streamlit Community Cloud. No usage statistics are sent to Streamlit.
# Local runs bind to this computer only via the command line: streamlit run app/app.py --server.address localhost
# (README.md); the cloud sets its own server address, so it is not fixed here.
[browser]
gatherUsageStats = false

# Light theme by default so the whole app matches the scientific (white) charts; can be switched in the ⋮ menu.
[theme]
base = "light"
